<header class="p-3 w-full fixed top-0 z-50 bg-gradient-to-r from-primary to-black">
    <div class="flex align-middle items-center px-10 mx-auto gap-6">

        <div class="text-white">
            <a routerLink="/" routerLinkActive="text-accent" [routerLinkActiveOptions]="{exact:true}" class="max-h-16 border-r-white border-r-2 pr-6 uppercase font-bold">
                Dating app
            </a>
        </div>

        <nav class="flex gap-3 my-2 uppercase text-lg text-white">
            @if(accountService.currentUser()) {
                <a routerLink="/members" routerLinkActive="text-accent">Matches</a>
                <a routerLink="/lists" routerLinkActive="text-accent">Lists</a>
                <a routerLink="/messages" routerLinkActive="text-accent">Messages</a>
            }

            <a routerLink="/errors" routerLinkActive="text-accent">Errors</a>
        </nav>
        <div class="flex align-middle ml-auto gap-3">
            @if (accountService.currentUser(); as user) {
            <div class="dropdown">
                <div tabindex="0" role="button" class="flex items-center text-white text-xl gap-3 cursor-pointer">
                    <img [src]="user?.imageUrl || '/avatar.jpeg'" alt="avatar" class="size-10 rounded-full"/>
                    <span>{{user?.displayName}}</span>
                </div>
                    <ul tabindex="-1" class="dropdown-content dropdown-end menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
                        <li><a>Edit Profile</a></li>
                        <li><a (click)="logout()">Logout</a></li>
                    </ul>
                </div>
            } @else {
            <form #loginForm="ngForm" (ngSubmit)="login()" action="" class="flex items-center gap-3">
                <input [(ngModel)]="creds.email" type="text" name="email" class="input" placeholder="Email">
                <input [(ngModel)]="creds.password" type="password" name="password" class="input" placeholder="Password">
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            }
           
        </div>
    </div>
</header>
